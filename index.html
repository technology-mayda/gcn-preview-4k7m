<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D0D0D">
<title>Acceleration Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Acceleration Navigator — prototype v4 · design-polish pass
   Generic "Ambition Accelerated" master brand (see _ref/brand/brand-spec-generic.md)
   v3 flows/behaviour kept. Rules: no shadows, no glows, no radial gradients, no gold.
   Monochrome UI. The Unity Gradient appears ONLY as:
     1) questionnaire / thinking progress line  2) the lockup underline
     3) one signature divider at the plan's "Ask us"  4) the map route arc
   Type: Expanded Black caps = H1/H2 only. Everything else = GT America Standard, sentence case.
   Scale (mobile) 44 / 32 / 22 / 17 / 14 / 12 · spacing on a 4/8pt grid.
   ========================================================= */
/* GT America (Grilli Type) — DESKTOP licence files, loaded locally for review.
   Before publishing as a web link: confirm a Grilli Type WEB licence, or delete these
   @font-face rules so the build falls back to Archivo (wdth 125) from Google Fonts. */
:root{
  /* ===== BRAND CONFIG — reskin here ===== */
  --unity:linear-gradient(90deg,#FFBF00 6.73%,#F97316 16.35%,#F97316 24.04%,#E11D48 37.98%,#E11D48 43.75%,#4F46E5 56.73%,#4F46E5 61.54%,#0891B2 71.63%,#0891B2 83.17%,#00DF81 94.23%);
  --bg:#0D0D0D;          /* master dark ground */
  --black:#000000;
  --raise:#141414;       /* image-slot fallback field */
  --text:#FFFFFF;
  --text2:#CCCCCC;       /* Gray 80 */
  --muted:#999999;       /* Gray 60 */
  --label:#888888;       /* labels, meta */
  --dim:#666666;         /* Gray 40 — indices */
  --rule:rgba(255,255,255,.14);   /* hairline */
  --rule-2:rgba(255,255,255,.28);
  --ph:#888888;          /* [bracket] placeholder outline */
  --err:#FF5A4E;         /* functional form error only — not a brand colour */
  --display:"GTA Expanded","Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"GTA Standard","Archivo","Helvetica Neue",Arial,system-ui,sans-serif;
  /* stills are shown monochrome (brand §4.4: master imagery is greyscale; the gradient is the only colour) */
  --still-filter:grayscale(1) contrast(1.05);
  --r:2px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --out:cubic-bezier(.16,1,.3,1);
  /* type scale */
  --fs-1:44px; --fs-2:32px; --fs-3:22px; --fs-4:17px; --fs-5:14px; --fs-6:12px;
  /* spacing (4/8) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px; --s9:96px;
  --g:24px;              /* side gutter = the one left edge */
  --top:64px;
}
@media (min-width:1024px){:root{--fs-1:80px;--fs-2:52px;--fs-3:26px;--fs-4:19px;--fs-5:15px;--g:56px;--top:80px}}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh;background:var(--bg);color:var(--text)}
body{font-family:var(--body);font-stretch:100%;font-size:var(--fs-4);line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input,textarea{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:var(--r)}
::selection{background:#fff;color:#000}
ol,ul{list-style:none}
img{display:block}
.defs{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}

#app{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transition:opacity .45s var(--ease)}
.screen.on{opacity:1}
.screen.off{opacity:0;pointer-events:none}
.rv{opacity:0;transform:translateY(14px);transition:opacity .8s var(--out),transform .8s var(--out);transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}

/* ---------- type ---------- */
.hx{font-family:var(--display);font-stretch:125%;font-weight:900;text-transform:uppercase;letter-spacing:-.02em;line-height:.92}
.hx2{font-family:var(--display);font-stretch:125%;font-weight:400;text-transform:uppercase;letter-spacing:-.01em;line-height:.98}
.eyebrow{display:block;font-size:13px;font-weight:500;letter-spacing:.005em;color:var(--label);line-height:1.4}
.idx{font-variant-numeric:tabular-nums}

/* ---------- controls ---------- */
.ar{width:18px;height:18px;flex:none;transition:transform .3s var(--out)}
.btn{display:inline-flex;align-items:center;justify-content:space-between;gap:24px;height:56px;padding:0 20px 0 24px;border-radius:var(--r);background:#fff;color:#000;font-size:16px;font-weight:500;letter-spacing:-.005em;white-space:nowrap;transition:background .2s,transform .15s var(--ease)}
.btn:hover{background:#EDEDED}
.btn:hover .ar{transform:translateX(3px)}
.btn:active{transform:scale(.985);background:#D6D6D6}
.btn.ghost{background:transparent;color:#fff;border:1px solid var(--rule-2)}
.btn.ghost:hover{border-color:#fff;background:transparent}
.btn.ghost:active{background:rgba(255,255,255,.06)}
.lnk{display:inline;font-weight:500;color:#fff;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px;text-decoration-color:rgba(255,255,255,.45);transition:text-decoration-color .2s,opacity .15s}
.lnk:hover{text-decoration-color:#fff}
.lnk:active{opacity:.6}
.tbtn{display:inline-flex;align-items:center;gap:10px;min-height:44px;font-size:15px;font-weight:500;color:#fff;transition:opacity .15s}
.tbtn:active{opacity:.6}
.tbtn .ic{width:28px;height:28px;border:1px solid var(--rule-2);border-radius:50%;display:grid;place-items:center;flex:none;transition:border-color .2s,background .2s}
.tbtn .ic svg{width:12px;height:12px}
.tbtn:hover .ic{border-color:#fff}

/* placeholders + tags */
.ph{color:#E5E5E5;border:1px dashed var(--ph);border-radius:var(--r);padding:0 4px;white-space:nowrap;font-weight:500}
.sample,.chip{display:inline-flex;align-items:center;font-weight:500;color:var(--label);border:1px solid var(--rule-2);border-radius:var(--r);white-space:nowrap;letter-spacing:.005em}
.sample{height:18px;padding:0 5px;font-size:11px;vertical-align:2px;line-height:1}
.chip{height:26px;padding:0 9px;font-size:12px}

/* Unity lines (progress only) */
.utrack{height:2px;background:var(--rule);position:relative;overflow:hidden}
.utrack i{position:absolute;inset:0;background:var(--unity);clip-path:inset(0 100% 0 0);transition:clip-path .8s var(--out)}

/* ---------- header system: monogram + product (app) · full wordmark (start, done) ---------- */
.top{flex:none;position:relative;z-index:20;display:flex;align-items:center;gap:16px;height:var(--top);padding:0 var(--g);border-bottom:1px solid var(--rule);background:var(--bg)}
.brand{display:flex;align-items:center;gap:12px;min-height:44px;color:#fff}
.brand .lk{display:block;flex:none}
.brand .lk-m{height:24px;width:auto}
.brand .prod{font-size:15px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;line-height:1}
.brand .lk-h{width:184px;height:auto}           /* cap A ≈ 7.4px → clear space ≥ 8px all sides */
.top .grow{flex:1}
.tlinks{display:flex;gap:20px;align-items:center}
.tlink{white-space:nowrap;font-size:15px;font-weight:500;color:var(--text2);min-height:44px;transition:color .2s,opacity .15s}
.tlink:hover{color:#fff}
.tlink:active{opacity:.6}

/* ---------- image slots: still on top of an intentional fallback ---------- */
.slot{position:relative;overflow:hidden;background:var(--raise)}
.slot .fb{position:absolute;inset:0}
.slot .fb svg{position:absolute;inset:0;width:100%;height:100%}
.slot .still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:var(--still-filter);opacity:0;transform:scale(1.03);transition:opacity 1s var(--ease),transform 2.4s var(--out)}
.slot .still.ok{opacity:1;transform:none}
.slot .ai{position:absolute;z-index:3;top:12px;right:12px;font-size:11px;font-weight:500;color:#fff;background:rgba(0,0,0,.72);border-radius:var(--r);padding:3px 7px;opacity:0;transition:opacity .6s}
.film .ai{display:none}
.slot .still.ok ~ .ai{opacity:1}

/* =========================================================
   MAP — legible, typographic
   ========================================================= */
.gcmap{display:block}
.gcmap .dot{fill:rgba(255,255,255,.13)}
.gcmap .dot.f{fill:rgba(255,255,255,.6)}
.gcmap .coast{fill:none;stroke:rgba(255,255,255,.55);stroke-width:1.2}
.gcmap .island{stroke:rgba(255,255,255,.45);stroke-width:3}
.gcmap .cline{stroke:rgba(255,255,255,.2);stroke-width:1;stroke-dasharray:2 4}
.gcmap .clab{font-family:var(--body);font-size:17px;font-weight:500;fill:rgba(255,255,255,.5)}
.gcmap .clab.f{fill:#fff}
.gcmap .node circle.c{fill:var(--bg);stroke:rgba(255,255,255,.6);stroke-width:1.5}
.gcmap .node text{font-family:var(--body);font-size:17px;font-weight:400;fill:rgba(255,255,255,.6)}
.gcmap .node .halo{fill:var(--bg)}
.gcmap .node.on circle.c{fill:#fff;stroke:#fff}
.gcmap .node.on text{fill:#fff;font-weight:500}
.gcmap .node.p .ring{fill:none;stroke:#fff;stroke-width:1.2}
.gcmap .arc{fill:none;stroke:url(#aaUnityRoute);stroke-width:2.5;stroke-linecap:round}
.gcmap .arcdot{fill:#fff}
.gcmap .arclab{font-family:var(--body);font-size:16px;font-weight:500;fill:#fff}
.gcmap .ocean{font-family:var(--body);font-size:15px;letter-spacing:.24em;fill:rgba(255,255,255,.3);font-weight:500}
/* the hero fallback: the coast itself as the picture */
.gcmap.hero .dot{fill:rgba(255,255,255,.16);r:1.4px}
.gcmap.hero .coast{stroke:rgba(255,255,255,.7)}
.gcmap.hero .node text{fill:rgba(255,255,255,.72);font-size:14px}
.gcmap.hero .node circle.c{fill:#fff;stroke:#fff}
.gcmap.hero .ocean{font-size:11px}
.gcmap.poster .dot{fill:rgba(255,255,255,.05);r:1.3px}
.gcmap.poster .dot.f{fill:rgba(255,255,255,.11)}
.gcmap.poster .coast{stroke:rgba(255,255,255,.4)}

/* =========================================================
   1 · START
   ========================================================= */
.attract{cursor:pointer}
.attract .top{border-bottom:0}
.att{flex:1;min-height:0;display:flex;flex-direction:column}
.hero-slot{flex:1;min-height:260px;background:var(--bg)}
.hero-slot:after{content:"";position:absolute;z-index:2;left:0;right:0;bottom:0;height:62%;background:linear-gradient(to top,var(--bg) 10%,rgba(13,13,13,.92) 42%,rgba(13,13,13,0));pointer-events:none}
.hero-slot .fb svg{opacity:.95}
.place{position:absolute;z-index:3;left:var(--g);right:var(--g);bottom:var(--s5)}
.place .pl{display:block;font-size:30px;color:#fff;margin-top:var(--s3)}
.place .eyebrow{color:var(--text2)}
.att-copy{flex:none;padding:var(--s2) var(--g) calc(var(--s5) + env(safe-area-inset-bottom))}
.att h1{display:block}
.att h1 .l1,.att h1 .l2{display:block}
.att h1 .l1{font-size:var(--fs-2)}
.att h1 .l2{font-size:var(--fs-3);color:var(--text2);margin-top:var(--s3);line-height:1.04}
.att-cta{margin-top:var(--s6);display:flex;flex-direction:column;gap:var(--s3)}
.att-cta .btn{width:100%}
.att-cta .meta{font-size:13px;color:var(--label);display:flex;justify-content:space-between;gap:12px}

/* =========================================================
   2 · INTAKE
   ========================================================= */
.intake .scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.intake .wrap{max-width:880px;padding:var(--s5) var(--g) var(--s8)}
.answered{display:flex;flex-direction:column}
.answered li{display:grid;grid-template-columns:72px minmax(0,1fr);gap:2px 12px;padding:var(--s3) 0;border-bottom:1px solid var(--rule);animation:fadeUp .5s var(--out)}
.answered .q{font-size:13px;font-weight:500;color:var(--label);padding-top:2px}
.answered .a{font-size:16px;font-weight:500;color:#fff;line-height:1.4}
.answered .k{grid-column:2;font-size:14px;color:var(--muted);line-height:1.45}
.qcur{margin-top:var(--s6)}
.qcur.enter{animation:qIn .6s var(--out) both}
.qcur.leave{opacity:0;transform:translateY(-10px);transition:opacity .22s var(--ease),transform .22s var(--ease)}
.qn{font-size:13px;font-weight:500;color:var(--label)}
.qn b{color:#fff;font-weight:500}
.qcur h2{font-size:var(--fs-2);margin:var(--s3) 0 var(--s3)}
.qcur .sub{font-size:15px;color:var(--muted);max-width:34em}
.opts{margin-top:var(--s5);border-top:1px solid var(--rule)}
.opt{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr) 20px;align-items:center;width:100%;min-height:60px;padding:12px 0;border-bottom:1px solid var(--rule);font-size:var(--fs-4);font-weight:400;color:var(--text2);line-height:1.35;transition:color .2s,background .2s,opacity .3s}
.opt .n{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;transition:color .2s}
.opt .ar{opacity:0;transform:translateX(-6px);transition:opacity .25s,transform .3s var(--out)}
.opt:hover{color:#fff}
.opt:hover .ar{opacity:1;transform:none}
.opt:active{background:rgba(255,255,255,.05)}
.opt.sel{color:#fff;font-weight:500}
.opt.sel .n{color:#fff}
.opt.sel .ar{opacity:1;transform:translateX(3px)}
.opt.sel:before{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:#fff;transform-origin:left;animation:lineIn .45s var(--out)}
.opts.dim .opt:not(.sel){opacity:.28;pointer-events:none}
.typed{margin-top:var(--s5);display:flex;align-items:flex-end;gap:var(--s4)}
.typed label{display:block}
.typed .f{flex:1;min-width:0}
.typed input{display:block;width:100%;height:48px;background:transparent;border:0;border-bottom:1px solid var(--rule-2);border-radius:0;outline:0;font-size:var(--fs-4);color:#fff;padding:0;transition:border-color .2s}
.typed input:focus{border-bottom-color:#fff}
.typed input::placeholder{color:#5E5E5E;transition:opacity .3s}
.typed input.swap::placeholder{opacity:0}
.typed .go{flex:none;display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 2px;font-size:15px;font-weight:500;color:#fff;border-bottom:1px solid #fff;transition:opacity .2s}
.typed .go .ar{width:16px;height:16px}
.typed .go:disabled{opacity:.28;cursor:default}
.typed .go:not(:disabled):active{opacity:.6}
.closing{margin-top:var(--s6);font-size:16px;color:var(--muted);animation:fadeUp .5s var(--out)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes qIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes lineIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* =========================================================
   3 · THINKING — one sweeping line, one status
   ========================================================= */
.think .body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:0 var(--g) 16vh;max-width:980px}
.think .goal{font-size:var(--fs-2);margin:var(--s3) 0 var(--s7);color:#fff;line-height:1.02}
.sweep{position:relative;height:2px;background:var(--rule);overflow:hidden;max-width:560px}
.sweep i{position:absolute;inset:0;background:var(--unity);animation:sweep 1.9s var(--ease) infinite}
@keyframes sweep{0%{clip-path:inset(0 100% 0 0)}55%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 100%)}}
.think .status{margin-top:var(--s4);font-size:15px;color:var(--text2);min-height:1.5em;transition:opacity .25s,transform .25s var(--ease)}
.think .status.out{opacity:0;transform:translateY(4px)}
.think .skip{margin-top:var(--s6);align-self:flex-start;font-size:15px}

/* =========================================================
   4 · PLAN
   ========================================================= */
.plan .scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.plan .wrap{max-width:1360px;margin:0 auto;padding:var(--s5) var(--g) calc(120px + env(safe-area-inset-bottom))}
.phero{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s6)}
.erow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.phero h1{font-size:40px;margin:var(--s4) 0 var(--s4)}
.lead{font-size:var(--fs-4);line-height:1.5;color:var(--text2);max-width:30em}
.spec{margin-top:var(--s5);border-top:1px solid var(--rule)}
.spec > div{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.spec dt{font-size:13px;font-weight:500;color:var(--label)}
.spec dd{font-size:15px;font-weight:500;color:#fff;overflow-wrap:anywhere;line-height:1.4}

/* film poster */
.film{display:block;width:100%;aspect-ratio:4/3;border-radius:var(--r);text-align:left;color:#fff;transition:transform .2s var(--ease)}
.film:active{transform:scale(.995)}
.film video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s;filter:var(--still-filter)}
.film.ready video{opacity:.75}
.film:after{content:"";position:absolute;z-index:1;left:0;right:0;bottom:0;height:70%;background:linear-gradient(to top,rgba(0,0,0,.9),rgba(0,0,0,.55) 45%,rgba(0,0,0,0));pointer-events:none}
.film .ftop{position:absolute;z-index:2;left:16px;right:16px;top:14px;display:flex;justify-content:flex-start;align-items:center;gap:8px}
.film .ftop .eyebrow{color:var(--text2)}
.film .flab{font-size:11px;font-weight:500;color:#fff;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.35);border-radius:var(--r);padding:3px 6px;white-space:nowrap}
.film .fbot{position:absolute;z-index:2;left:16px;right:16px;bottom:16px;display:flex;align-items:flex-end;gap:14px}
.film .play{width:52px;height:52px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;flex:none;transition:transform .3s var(--out)}
.film .play svg{width:18px;height:18px;margin-left:3px}
.film:hover .play{transform:scale(1.06)}
.film .ftxt{flex:1;min-width:0}
.film .ftt{display:block;font-size:28px}
.film .fst{display:block;font-size:15px;font-weight:500;margin-top:6px;color:#fff}
.film .dur{font-weight:400;color:var(--text2);font-variant-numeric:tabular-nums;white-space:nowrap}
.film .dur:before{content:"  ·  ";white-space:pre}
.film.missing .dur{color:var(--text2)}

/* where we'd start */
.where{margin-top:var(--s7);border-top:1px solid var(--rule-2);padding-top:var(--s4)}
.where .wh{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.counties{margin-top:var(--s3)}
.counties li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:0 8px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--rule);color:var(--muted)}
.counties .mk{width:9px;height:9px;border:1px solid var(--rule-2);transform:translateY(-1px)}
.counties .cn{font-size:var(--fs-4);font-weight:500;color:var(--text2)}
.counties .ct{grid-column:2/-1;font-size:14px;color:var(--label);margin-top:2px}
.counties .rec{font-size:12px;font-weight:500;color:#000;background:#fff;border-radius:var(--r);padding:3px 7px;white-space:nowrap}
.counties li.on .mk{background:#fff;border-color:#fff}
.counties li.on .cn{color:#fff}
.counties li.on .ct{color:var(--text2)}
.mapwrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s var(--out)}
.mapwrap > div{min-height:0;overflow:hidden}
.mapwrap.open{grid-template-rows:1fr}
.mapwrap svg{width:100%;height:auto;margin:var(--s4) 0 var(--s2)}
.mapbtn{margin-top:var(--s2)}
.mapbtn .ic svg{transition:transform .4s var(--out)}
.mapbtn[aria-expanded="true"] .ic svg{transform:rotate(45deg)}

/* sections */
.sec{margin-top:var(--s8);border-top:1px solid var(--rule-2);padding-top:var(--s4);display:grid;grid-template-columns:minmax(0,1fr)}
.sec-h .idx{display:block;font-size:13px;font-weight:500;color:var(--label)}
.sec-h h2{font-size:var(--fs-2);margin-top:var(--s4)}
.sec-h p{margin-top:var(--s3);font-size:15px;color:var(--muted);max-width:32em}
.sec-b{margin-top:var(--s5)}

/* advantages */
.rows > li{border-top:1px solid var(--rule);padding:var(--s5) 0}
.rows > li:first-child{border-top:0;padding-top:var(--s2)}
.rows .rh{display:flex;flex-direction:column-reverse;align-items:flex-start;gap:10px}
.rows h3{font-size:20px;font-weight:500;line-height:1.25;letter-spacing:-.01em}
.match{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:500;color:var(--label);white-space:nowrap}
.match:before{content:"";width:7px;height:7px;border:1px solid currentColor}
.match.s3{color:#fff}
.match.s3:before{background:#fff}
.rows p{font-size:15px;color:var(--text2);line-height:1.55;margin-top:var(--s2)}
.rows .proof{font-size:14px;color:var(--muted);margin-top:var(--s2)}

/* directory rows — name first, meta second, expand for detail */
.dir{border-top:1px solid var(--rule)}
.dir > li{border-bottom:1px solid var(--rule)}
.dbtn{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:4px 16px;align-items:center;width:100%;min-height:80px;padding:14px 0;transition:background .2s}
.dbtn:active{background:rgba(255,255,255,.04)}
.dbtn .dt{font-size:var(--fs-4);font-weight:500;color:#fff;line-height:1.3}
.dbtn .dm{grid-column:1;font-size:14px;color:var(--label);line-height:1.4}
.dbtn .dm b{font-weight:500;color:var(--text2)}
.dbtn .ic{grid-column:2;grid-row:1/3;width:28px;height:28px;border:1px solid var(--rule);border-radius:50%;display:grid;place-items:center;color:var(--text2);transition:border-color .2s,color .2s}
.dbtn .ic svg{width:12px;height:12px;transition:transform .4s var(--out)}
.dbtn:hover .ic{border-color:#fff;color:#fff}
.dbtn[aria-expanded="true"] .ic svg{transform:rotate(45deg)}
.dd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--out)}
.dd > div{min-height:0;overflow:hidden}
.dd p{font-size:15px;color:var(--text2);line-height:1.55;padding:0 44px var(--s4) 0}
li.open .dd{grid-template-rows:1fr}

/* people */
.people > li{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:16px;padding:var(--s5) 0;border-bottom:1px solid var(--rule)}
.people{border-top:1px solid var(--rule)}
.people .nm{font-size:var(--fs-4);font-weight:500;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.people .rl{font-size:14px;color:var(--text2);margin-top:4px}
.people .org{font-size:14px;color:var(--label)}
.people .why{grid-column:1/-1;font-size:14px;color:var(--muted);line-height:1.55;margin-top:var(--s2)}
.toggle{grid-row:1;grid-column:2;align-self:start;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 10px;border:1px solid var(--rule-2);border-radius:var(--r);font-size:13px;font-weight:500;color:var(--text2);white-space:nowrap;transition:background .2s,color .2s,border-color .2s,transform .15s}
.toggle:active{transform:scale(.97)}
.toggle .box{width:14px;height:14px;display:grid;place-items:center}
.toggle .box svg{width:14px;height:14px}
.toggle[aria-pressed="true"]{border-color:#fff;color:#fff}
.toggle:hover{border-color:#fff}

/* 90 days */
.phases{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s6)}
.phase .bar{height:2px;background:var(--rule);position:relative;overflow:hidden;margin-bottom:var(--s4)}
.phase .bar i{position:absolute;inset:0;background:#fff;clip-path:inset(0 100% 0 0);transition:clip-path 1.1s var(--out);transition-delay:var(--d,0ms)}
.phase .bar.in i{clip-path:inset(0 0 0 0)}
.phase h4{font-size:var(--fs-3);font-weight:500;letter-spacing:-.01em;margin:6px 0 var(--s3)}
.phase ul li{font-size:15px;color:var(--text2);line-height:1.45;padding:11px 0;border-top:1px solid var(--rule)}

/* success story */
.story h3{font-size:var(--fs-3);font-weight:500;line-height:1.25;letter-spacing:-.01em;margin-top:var(--s3)}
.story .co{font-size:14px;color:var(--label);margin-top:var(--s2)}
.story .d{font-size:15px;color:var(--text2);line-height:1.55;margin-top:var(--s3);max-width:34em}
.stats{display:grid;grid-template-columns:1fr 1fr;margin-top:var(--s5);border-top:1px solid var(--rule)}
.stats > div{padding:var(--s4) 12px 0 0}
.stats > div + div{border-left:1px solid var(--rule);padding-left:var(--s4)}
.stats b{display:block;font-size:20px;font-weight:500}
.stats > div > span{display:block;font-size:13px;color:var(--label);margin-top:4px}
.story .act{margin-top:var(--s5)}

/* the one signature divider */
.sig{margin-top:var(--s8);height:3px;position:relative}
.sig i{position:absolute;inset:0;background:var(--unity);clip-path:inset(0 100% 0 0);transition:clip-path 1.6s var(--out)}
.sig.in i{clip-path:inset(0 0 0 0)}
.sec.ask{margin-top:0;border-top:0;padding-top:var(--s5)}
.qs .opt{font-size:16px}
.thread2 .qa{padding:var(--s4) 0;border-bottom:1px solid var(--rule);animation:fadeUp .5s var(--out)}
.thread2 .qa .q{font-size:13px;font-weight:500;color:var(--label)}
.thread2 .qa p{font-size:16px;line-height:1.6;color:#fff;margin-top:6px;max-width:40em}
.planfoot{margin-top:var(--s8);padding-top:var(--s4);border-top:1px solid var(--rule);display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 24px;font-size:12px;color:var(--dim)}

/* CTA bar — slim, collapses to the button while scrolling */
.ctabar{position:absolute;left:0;right:0;bottom:0;z-index:30;padding:10px var(--g) calc(10px + env(safe-area-inset-bottom));background:var(--black);border-top:1px solid var(--rule);transform:translateY(110%);transition:transform .6s var(--out),background .35s,border-color .35s}
.ctabar.in{transform:none}
.ctabar .in2{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:16px}
.ctabar .q{flex:1;min-width:0;transition:opacity .3s,transform .35s var(--out)}
.ctabar .q .dq{display:none;font-size:16px;font-weight:500;line-height:1.3}
.ctabar .cl{display:block;font-size:12px;color:var(--label);line-height:1.35}
.ctabar .cnt{display:block;font-size:14px;font-weight:500;color:#fff;margin-bottom:2px}
.ctabar .rest{display:block}
.ctabar .rest:first-letter{text-transform:uppercase}
.ctabar .btn{height:48px;padding:0 16px 0 18px;gap:12px;font-size:15px}
.ctabar.mini{background:transparent;border-top-color:transparent;pointer-events:none}
.ctabar.mini .q{opacity:0;transform:translateY(6px)}
.ctabar.mini .btn{pointer-events:auto}

/* =========================================================
   5 · HANDOFF SHEET + CONFIRMATION
   ========================================================= */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.8);opacity:0;transition:opacity .4s}
.sheet .panel{position:relative;width:100%;max-height:calc(100% - env(safe-area-inset-top) - 12px);overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-top:1px solid var(--rule-2);transform:translateY(100%);transition:transform .6s var(--out)}
.sheet.on{pointer-events:auto}
.sheet.on .scrim{opacity:1}
.sheet.on .panel{transform:none}
.sheet .x{position:absolute;top:10px;right:calc(var(--g) - 10px);z-index:2;width:44px;height:44px;display:grid;place-items:center;color:#fff;border-radius:50%;transition:background .2s}
.sheet .x svg{width:18px;height:18px}
.sheet .x:hover{background:rgba(255,255,255,.08)}
.ho{display:grid;grid-template-columns:minmax(0,1fr)}
.ho .l,.ho .r{padding:var(--s6) var(--g)}
.ho .r{padding-bottom:calc(var(--s6) + env(safe-area-inset-bottom));border-top:1px solid var(--rule)}
.ho h2{font-size:var(--fs-2);margin:var(--s3) 0 var(--s4);padding-right:48px}
.ho .l > p{color:var(--text2);font-size:16px;max-width:30em}
.intros{margin-top:var(--s5);border-top:1px solid var(--rule)}
.intros li{display:grid;gap:2px;padding:12px 0;border-bottom:1px solid var(--rule)}
.intros b{font-size:16px;font-weight:500;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.intros span.r2{font-size:14px;color:var(--label)}
.plus{margin-top:var(--s4);font-size:14px;color:var(--muted);line-height:1.55}
form .grid{display:grid;grid-template-columns:minmax(0,1fr);gap:4px 24px}
.fld{display:flex;flex-direction:column}
.fld.full{grid-column:1/-1}
.fld label{font-size:13px;font-weight:500;color:var(--label);margin-top:var(--s4)}
.fld label i{font-style:normal;color:var(--dim)}
.fld input{height:46px;background:transparent;border:0;border-bottom:1px solid var(--rule-2);border-radius:0;outline:0;font-size:var(--fs-4);color:#fff;padding:0;transition:border-color .2s}
.fld input:focus{border-bottom-color:#fff}
.fld input::placeholder{color:#5A5A5A}
.fld input.err{border-bottom-color:var(--err)}
.fld .em{font-size:13px;color:var(--err);margin-top:6px}
.fld .em:empty{display:none}
.how{margin-top:var(--s6)}
.how .opts{margin-top:var(--s2)}
.how .opt{font-size:16px;min-height:52px}
.consent{margin-top:var(--s5);font-size:13px;color:var(--label);line-height:1.55}
.submit{margin-top:var(--s5);width:100%}

.done{padding:var(--s7) var(--g) calc(var(--s6) + env(safe-area-inset-bottom));max-width:1180px}
.done .dl{display:inline-block;padding:8px 0}                 /* clear space ≥ cap A */
.done .dl svg{display:block;width:200px;height:auto;color:#fff}
.done .dl rect{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:barIn 1.1s var(--out) .25s forwards}
@keyframes barIn{to{transform:scaleX(1)}}
.done h2{font-size:var(--fs-1);margin:var(--s7) 0 var(--s3);padding-right:40px}
.done .sub2{font-size:var(--fs-3);color:var(--text2);max-width:24em;line-height:1.08}
.done .p{margin-top:var(--s5);color:var(--text2);font-size:16px;max-width:34em}
.done .p b{color:#fff;font-weight:500}
.done .rv2{opacity:0;animation:fadeUp .7s var(--out) forwards;animation-delay:var(--d,0ms)}
.next{margin-top:var(--s6);position:relative}
.next li{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr);gap:2px 12px;padding:0 0 var(--s5)}
.next li:before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:1px;background:var(--rule-2)}
.next li:last-child:before{display:none}
.next .dot{grid-row:1/4;width:23px;height:23px;border:1px solid var(--rule-2);border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:500;color:var(--label);background:var(--bg);position:relative}
.next li.now .dot{background:#fff;border-color:#fff;color:#000}
.next li.now .dot svg{width:13px;height:13px}
.next .eyebrow{padding-top:2px}
.next b{font-size:var(--fs-4);font-weight:500}
.next .s{font-size:14px;color:var(--muted);line-height:1.5}
.ref{margin-top:var(--s2);font-size:13px;color:var(--label);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.ref b{color:#fff;font-weight:500;letter-spacing:.04em}
.done .acts{display:flex;flex-direction:column;gap:var(--s4);margin-top:var(--s6);align-items:stretch}
.done .acts .lnk{align-self:center;padding:8px 0}

/* toast */
.toast{position:fixed;left:var(--g);right:var(--g);top:calc(var(--top) + 12px);z-index:100;opacity:0;transform:translateY(-8px);pointer-events:none;background:#fff;color:#000;border-radius:var(--r);padding:14px 18px;font-size:14px;font-weight:500;transition:opacity .3s,transform .4s var(--out)}
.toast.on{opacity:1;transform:none}

/* =========================================================
   6 · FILM PLAYER
   ========================================================= */
body.noscroll{overflow:hidden}
.player{position:fixed;inset:0;z-index:90;background:#000;display:flex;flex-direction:column;opacity:0;pointer-events:none;visibility:hidden;transition:opacity .35s var(--ease),visibility 0s .35s}
.player.on{opacity:1;pointer-events:auto;visibility:visible;transition:opacity .35s var(--ease)}
.player .pbar{flex:none;display:flex;align-items:center;gap:14px;min-height:var(--top);padding:env(safe-area-inset-top) var(--g) 0;border-bottom:1px solid var(--rule)}
.player .pbar .t{flex:1;min-width:0}
.player .pbar b{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .pbar b i{font-style:normal;color:var(--text2);font-weight:400}
.player .pbar span{display:block;font-size:12px;color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.player .px{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;margin-right:-10px}
.player .px svg{width:18px;height:18px}
.player .px:hover{background:rgba(255,255,255,.08)}
.player .pstage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.player video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
.player .pfoot{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:12px var(--g) calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--rule)}
.ailabel{display:inline-flex;align-items:center;height:26px;padding:0 8px;border:1px solid var(--rule-2);border-radius:var(--r);font-size:12px;font-weight:500;color:rgba(255,255,255,.8);white-space:nowrap}
.ailabel.g{color:#fff;border-color:#fff}
.player .pnote{font-size:12px;color:var(--label);flex-basis:100%}
.inprod{position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:24px var(--g);overflow-y:auto;max-width:900px}
.inprod[hidden]{display:none}
.inprod .w{font-size:clamp(48px,14vw,120px)}
.inprod .s{margin-top:var(--s4);font-size:var(--fs-3);font-weight:500;color:#fff}
.inprod .state{margin-top:var(--s5);font-size:12px;font-weight:500;color:var(--text2);border:1px dashed var(--ph);border-radius:var(--r);padding:5px 8px}
.inprod p{margin-top:var(--s4);max-width:30em;font-size:16px;line-height:1.55;color:var(--text2)}
.inprod .lnk{margin-top:var(--s5);font-size:16px}
.inprod small{margin-top:var(--s5);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;word-break:break-all}
.player.missing video,.player.missing .pnote{display:none}

/* =========================================================
   PHONE → TABLET → DESKTOP
   ========================================================= */
@media (max-width:359px){ .brand .prod{display:none} }
@media (max-width:767px){
  .chip .pl2{display:none}
  .tlinks{gap:16px}
  .tlink{font-size:14px}
  .brand .prod{font-size:14px}
  .top{gap:12px}
}
@media (max-width:1023px){
  .plan .top .brand .prod{max-width:none}
}
@media (min-width:768px) and (max-width:1023px){
  body{background:#000}
  #app{left:0;right:0;width:600px;margin:0 auto;border-left:1px solid var(--rule);border-right:1px solid var(--rule);background:var(--bg)}
}
@media (min-width:1024px){
  .brand .lk-m{height:28px}
  .brand .prod{font-size:16px}
  .brand .lk-h{width:232px}
  .tlinks{gap:32px}

  /* start: copy left, image bleeds right */
  .att{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr)}
  .hero-slot{grid-column:2;grid-row:1;min-height:0}
  .hero-slot:after{height:46%}
  .place{left:40px;right:40px;bottom:40px}
  .place .pl{font-size:44px}
  .att-copy{grid-column:1;grid-row:1;align-self:center;padding:0 64px 32px var(--g)}
  .att h1 .l1{font-size:clamp(48px,min(4.6vw,7.4vh),76px)}
  .att h1 .l2{font-size:clamp(26px,min(2.4vw,4vh),40px);margin-top:var(--s5)}
  .att-cta{margin-top:var(--s7);flex-direction:row;align-items:center;gap:var(--s5)}
  .att-cta .btn{width:auto;min-width:260px;height:64px;font-size:17px}
  .att-cta .meta{flex-direction:column;gap:2px}

  .intake .wrap{padding:var(--s7) var(--g) var(--s8)}
  .answered li{grid-template-columns:120px minmax(0,1fr);padding:14px 0}
  .qcur{margin-top:var(--s7)}
  .qcur .sub{font-size:17px}
  .opt{font-size:20px;min-height:68px;grid-template-columns:56px minmax(0,1fr) 24px}
  .typed{max-width:720px;margin-top:var(--s6)}

  .think .goal{font-size:clamp(40px,4.2vw,60px)}

  .plan .wrap{padding-top:var(--s7)}
  .phero{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:64px;align-items:start}
  .phero h1{font-size:clamp(52px,4.8vw,76px);margin:var(--s5) 0 var(--s5)}
  .lead{font-size:20px}
  .spec{margin-top:var(--s6);display:grid;grid-template-columns:1fr 1fr;column-gap:32px}
  .spec > div{grid-template-columns:96px minmax(0,1fr)}
  .film{aspect-ratio:4/3}
  .film .ftop{left:24px;right:24px;top:20px}
  .film .fbot{left:24px;right:24px;bottom:24px;gap:18px}
  .film .play{width:64px;height:64px}
  .film .ftt{font-size:44px}
  .film .fst{font-size:17px}

  .where{margin-top:var(--s9);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 64px;padding-top:var(--s5)}
  .where .wh{grid-column:1}
  .counties{grid-column:1;margin-top:var(--s4);align-self:start}
  .counties li{padding:20px 0}
  .counties .cn{font-size:20px}
  .mapwrap{grid-column:2;grid-row:1/4;grid-template-rows:1fr}
  .mapwrap svg{height:600px;width:100%;margin:0}
  .mapbtn{display:none}

  .sec{grid-template-columns:minmax(0,1fr) minmax(0,1.65fr);gap:64px;margin-top:var(--s9);padding-top:var(--s5)}
  .sec-h{position:sticky;top:var(--s5);align-self:start}
  .sec-h h2{font-size:clamp(36px,3.1vw,48px)}
  .sec-h p{font-size:16px}
  .sec-b{margin-top:0}
  .rows > li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:8px 40px;padding:var(--s5) 0}
  .rows > li:first-child{padding-top:0}
  .rows .rh{flex-direction:column;gap:10px}
  .rows h3{font-size:22px}
  .rows p{margin-top:0}
  .dbtn{min-height:88px}
  .dbtn .dt{font-size:20px}
  .people > li{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) auto;column-gap:32px}
  .people .who{grid-column:1}
  .people .why{grid-column:2;grid-row:1;margin-top:0}
  .people .toggle{grid-column:3;grid-row:1}
  .phases{grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
  .phase{padding-right:24px}
  .phase:not(:last-child) .bar{margin-right:-24px}
  .stats b{font-size:24px}
  .sig{margin-top:var(--s9)}
  .sec.ask{margin-top:0}

  .ctabar{padding:14px var(--g)}
  .ctabar .q .dq{display:block}
  .ctabar .cl{font-size:13px;margin-top:2px}
  .ctabar .cnt,.ctabar .rest{display:inline;font-size:13px;font-weight:400;color:var(--label)}
  .ctabar .rest:before{content:" · "}
  .ctabar .btn{height:52px;padding:0 20px 0 24px;font-size:16px}

  .sheet .panel{width:min(1180px,calc(100% - 96px));border:1px solid var(--rule-2);border-bottom:0}
  .ho{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}
  .ho .l,.ho .r{padding:var(--s8) var(--s7)}
  .ho .r{border-top:0;border-left:1px solid var(--rule)}
  form .grid{grid-template-columns:1fr 1fr}
  .sheet .x{right:24px;top:20px}
  .done{padding:var(--s8) var(--s8) var(--s7)}
  .done .dl svg{width:280px}
  .done h2{font-size:clamp(56px,5.6vw,88px)}
  .next{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 32px}
  .next li{grid-template-columns:minmax(0,1fr);padding:0}
  .next li:before{left:32px;right:-32px;top:11px;bottom:auto;width:auto;height:1px}
  .next .dot{grid-row:auto;margin-bottom:var(--s3)}
  .done .acts{flex-direction:row;align-items:center;gap:var(--s6)}
  .ref{margin-top:var(--s6)}
  .done .acts .lnk{align-self:auto}

  .player .pstage{padding:0 48px}
  .player video{max-width:1400px}
  .player .pnote{flex-basis:auto;margin-left:auto}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .rv{opacity:1;transform:none}
  .sweep i{clip-path:none}
}

</style>
</head>

  for (const k of Object.keys(KW)) {
    const m = text.match(new RegExp(KW[k].source, "gi"));
    const n = m ? m.length : 0;
    if (n > score) { score = n; best = k; }

}

  if (/boston|cambridge|massachusetts/i.test(t)) return "Boston";
  if (/los angeles|\bla\b|l\.a\./i.test(t)) return "Los Angeles";
  const clean = t.replace(/^(we('| a)re|i('| a)m|based|in|from|out of)\s+/gi,"").replace(/[.!]+$/,"").slice(0,32);
  return clean ? clean.replace(/\b\w/g, c => c.toUpperCase()) : "your current market";
}
function detectSize(text){
  const n = parseInt(String(text).replace(/[, ]/g,"").match(/\d+/)?.[0] || "", 10);

  if (n < 50) return "Under 50"; if (n <= 250) return "50–250"; if (n <= 1000) return "250–1,000"; return "1,000+";
}

/* =========================================================
   MAP (SE Florida, simplified from real coordinates)
   ========================================================= */
const LAT0 = 27.03, LAT1 = 25.30, LON0 = -80.95, LON1 = -79.62, K = 400, CX = Math.cos(26.2 * Math.PI/180);
const W = Math.round((LON1-LON0)*CX*K), H = Math.round((LAT0-LAT1)*K);
const px = lon => (lon-LON0)*CX*K, py = lat => (LAT0-lat)*K;
const COAST = [[27.03,-80.082],[26.945,-80.072],[26.85,-80.045],[26.77,-80.035],[26.60,-80.035],[26.53,-80.048],[26.45,-80.060],[26.35,-80.072],[26.26,-80.083],[26.15,-80.095],[26.08,-80.108],[25.98,-80.118],[25.935,-80.125],[25.90,-80.158],[25.85,-80.180],[25.77,-80.188],[25.72,-80.235],[25.65,-80.285],[25.58,-80.318],[25.50,-80.335],[25.42,-80.330],[25.35,-80.372],[25.30,-80.400]];
function coastLon(lat){
  for (let i=0;i<COAST.length-1;i++){
    const [a,la] = COAST[i], [b,lb] = COAST[i+1];
    if (lat <= a && lat >= b) return la + (lb-la)*((a-lat)/(a-b));
  }
  return -80.4;
}
const county = lat => lat > 26.322 ? "pbc" : lat > 25.957 ? "bro" : "mdc";
const NODES = {
  jup:{n:"Jupiter", lat:26.934, lon:-80.094},
  wpb:{n:"West Palm Beach", lat:26.715, lon:-80.053},
  boca:{n:"Boca Raton", lat:26.368, lon:-80.128},
  ftl:{n:"Fort Lauderdale", lat:26.122, lon:-80.137},
  mia:{n:"Miami", lat:25.774, lon:-80.193},
  dor:{n:"Doral", lat:25.819, lon:-80.355, left:true},
};
/* variant: "map" (legible plan map) · "hero" (start-screen fallback) · "poster" (film fallback) */
function mapSVG({focus=[], on=[], primary=null, from=null, variant="map", vb=null, par="xMidYMid meet", labels=true}={}){
  const step = 0.0215, out = [];
  for (let lat = LAT0-0.01; lat > LAT1; lat -= step){
    const cl = coastLon(lat);
    for (let x = 8; x < W; x += step*K){
      const lon = LON0 + x/(CX*K);
      if (lon > cl - 0.006) break;
      const f = focus.includes(county(lat));
      out.push(`<circle class="dot${f?" f":""}" cx="${x.toFixed(1)}" cy="${py(lat).toFixed(1)}" r="1.8"/>`);
    }
  }
  const coast = COAST.map(([la,lo]) => `${px(lo).toFixed(1)},${py(la).toFixed(1)}`).join(" ");
  const cl = lat => `<line class="cline" x1="0" y1="${py(lat)}" x2="${px(coastLon(lat))}" y2="${py(lat)}"/>`;
  const clab = (lat, t, k) => `<text class="clab${focus.includes(k)?" f":""}" x="16" y="${py(lat)}">${t}</text>`;
  let nodes = "";
  if (labels) for (const [k,v] of Object.entries(NODES)){
    const isOn = on.includes(k);
    if (variant === "map" || isOn){
      const x = px(v.lon), y = py(v.lat), isP = k === primary;
      const tx = v.left ? x-14 : x+14;
      nodes += `<g class="node${isOn?" on":""}${isP?" p":""}">${isP?`<circle class="ring" cx="${x}" cy="${y}" r="11"/>`:""}<circle class="c" cx="${x}" cy="${y}" r="${isP?5.5:4.5}"/><text x="${tx}" y="${y+6}" text-anchor="${v.left?"end":"start"}">${v.n}</text></g>`;
    }
  }
  let arc = "";
  if (primary && from){
    const p = NODES[primary], x = px(p.lon), y = py(p.lat);
    const sx = W-22, sy = 34;
    arc = `<path class="arc" d="M${sx},${sy} C${W+4},${(sy+y)/2} ${x+70},${y-40} ${x+10},${y-8}"/><circle class="arcdot" cx="${sx}" cy="${sy}" r="4"/><text class="arclab" x="${sx}" y="${sy-16}" text-anchor="end">From ${esc(from)}</text>`;
  }
  const county3 = variant === "map" ? `${cl(26.322)}${cl(25.957)}${clab(26.86,"Palm Beach","pbc")}${clab(26.27,"Broward","bro")}${clab(25.66,"Miami-Dade","mdc")}` : "";
  return `<svg class="gcmap ${variant}" viewBox="${vb || `0 0 ${W} ${H}`}" preserveAspectRatio="${par}" role="img" aria-label="Map of Florida's Gold Coast: Palm Beach, Broward and Miami-Dade counties">
    <g>${out.join("")}</g>
    ${county3}
    <polyline class="coast" points="${coast}"/>
    <line class="island" x1="${px(-80.121)}" y1="${py(25.935)}" x2="${px(-80.131)}" y2="${py(25.768)}"/>
    <line class="island" x1="${px(-80.156)}" y1="${py(25.708)}" x2="${px(-80.160)}" y2="${py(25.668)}"/>
    ${variant !== "poster" ? `<text class="ocean" x="${W-24}" y="${py(25.45)}" text-anchor="end">ATLANTIC OCEAN</text>` : ""}
    ${arc}
    <g>${nodes}</g>
  </svg>`;
}
/* a 4:3 window onto the coast around a node — the film poster's fallback */
function posterMap(sc){
  const p = NODES[sc.primary], x = px(p.lon), y = py(p.lat), w = 440, h = 330;
  const vx = Math.max(0, Math.min(W - w, x - w*.72)), vy = Math.max(0, Math.min(H - h, y - h*.5));
  return mapSVG({focus:sc.counties, on:[], variant:"poster", vb:`${vx.toFixed(0)} ${vy.toFixed(0)} ${w} ${h}`, par:"xMidYMid slice", labels:false});
}

  const els = $$(".rv, .sig", root);

}

const QUESTIONS = [

  {q:"Where are you based today?", sub:"We'll compare everything against it.", ph:"Your city or region", short:"Based in"},

function setStep(n, done){
  const p = $("#iprog"); if (p) p.style.clipPath = `inset(0 ${100 - Math.round(((done ? n+1 : n) / 3) * 100)}% 0 0)`;
}
function renderQuestion(step, options){
  const Q = QUESTIONS[step], box = $("#qcur"); if (!box) return;
  box.innerHTML = `<div class="qcur enter">
      <p class="qn">Question <b>${step+1}</b> of 3</p>
      <h2 class="hx fit">${Q.q}</h2>
      <p class="sub">${Q.sub}</p>
      <ol class="opts" id="chips">${options.map((x,i) => `<li><button class="opt" type="button" data-i="${i}"><span class="n">${nn(i)}</span><span>${esc(x.t)}</span>${I.arrow}</button></li>`).join("")}</ol>

function onPick(list, pick){
  $$("#chips .opt").forEach(b => b.addEventListener("click", () => { if (S.busy) return; pick(list[+b.dataset.i], b); }));
}
function scrollQ(){
  const c = $(".intake .scroll"), q = $("#qcur"); if (!c || !q) return;
  const prev = $("#answered li:last-child");
  const qTop = q.getBoundingClientRect().top - c.getBoundingClientRect().top + c.scrollTop;
  const top = Math.max(0, qTop - (prev ? prev.offsetHeight : 0) - 20);
  c.scrollTo({top, behavior: RM ? "auto" : "smooth"});
}
/* Q1: the start screen's old example quotes now rotate through the answer field */
function rotatePlaceholder(){
  let i = 0;
  const rot = () => {
    const ta = $("#ta"); if (!ta || S.step !== 0 || ta === document.activeElement || ta.value) { if (ta && S.step === 0) later(rot, 3600); return; }
    ta.classList.add("swap");
    later(() => { i = (i+1) % EXAMPLES.length; ta.placeholder = `e.g. ${EXAMPLES[i]}`; ta.classList.remove("swap"); }, 320);
    later(rot, 3600);
  };
  if (!RM) later(rot, 3600);
}
async function ask(step){
  S.step = step; setStep(step);
  if (step === 0){
    renderQuestion(0, NEEDS);
    onPick(NEEDS, (x, b) => { b.classList.add("sel"); answer(x.t, x); });
    rotatePlaceholder();
  } else if (step === 1){
    const list = MARKETS.map(([t,v]) => ({t, v}));
    renderQuestion(1, list);
    onPick(list, (x, b) => {
      if (!x.v){ $$("#chips .opt").forEach(o => o.classList.remove("sel")); const ta = $("#ta"); ta.placeholder = "Your city — e.g. Atlanta, Toronto, London"; ta.focus(); return; }
      b.classList.add("sel"); answer(x.t, x);
    });
  } else {
    const list = SIZES.map(t => ({t}));
    renderQuestion(2, list);
    onPick(list, (x, b) => { b.classList.add("sel"); answer(x.t, x); });
  }
  scrollQ();
}
function logAnswer(step, text, note){
  const ol = $("#answered"); if (!ol) return;
  const li = document.createElement("li");
  li.innerHTML = `<span class="q">${QUESTIONS[step].short}</span><span class="a">${esc(text)}</span>${note?`<span class="k">${note}</span>`:""}`;
  ol.appendChild(li);
}
async function answer(text, chip){
  if (S.busy) return;
  S.busy = true;
  const c = $("#chips"); c && c.classList.add("dim");
  setStep(S.step, true);
  await wait(chip ? 360 : 80);
  const cur = $("#qcur .qcur"); if (cur){ cur.classList.remove("enter"); cur.classList.add("leave"); }
  await wait(230);
  if (S.step === 0){
    S.goal = text;
    S.scn = chip ? chip.s : (detectScenario(text) || "hq");
    S.unmatched = !chip && !detectScenario(text);
    logAnswer(0, text, S.unmatched ? "We'll start broad and narrow it down with you." : SC[S.scn].ack);
    S.busy = false; ask(1);
  } else if (S.step === 1){
    S.market = chip ? chip.v : detectMarket(text);
    logAnswer(1, text, `We'll benchmark against ${esc(S.market)}.`);
    S.busy = false; ask(2);
  } else {
    S.size = chip ? chip.t : detectSize(text);
    logAnswer(2, text, "");
    const box = $("#qcur"); if (box) box.innerHTML = `<p class="closing">That's everything. Putting your plan together.</p>`;
    scrollQ();
    later(thinking, 700);
  }
}

  $$("#how .opt", s).forEach(b => b.addEventListener("click", () => { $$("#how .opt", s).forEach(x => x.classList.remove("sel")); b.classList.add("sel"); S.how = b.dataset.t; }));
  $("#hf", s).addEventListener("submit", e => {
    e.preventDefault();
    const n = $("#hn", s), em = $("#he", s);
    let ok = true;
    const flag = (inp, msg) => { inp.classList.toggle("err", !!msg); inp.nextElementSibling.textContent = msg || ""; if (msg) ok = false; };
    flag(n, n.value.trim() ? "" : "Please add your name");
    flag(em, /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em.value.trim()) ? "" : "Please add a valid work email");
    if (!ok) return;
    confirmed({name: n.value.trim().split(" ")[0], email: em.value.trim(), company: $("#hc", s).value.trim(), list});
  });
  $(".panel", s).scrollTop = 0;
  fit(s);
  requestAnimationFrame(() => s.classList.add("on"));
}
function confirmed({name, email, company, list}){
  const s = ensureSheet();
  const ref = "GC27-" + Math.random().toString(36).slice(2,6).toUpperCase();
  $(".content", s).innerHTML = `
    <div class="done">
      <div class="dl" aria-label="${BRAND.logoLabel}">${LOGO.s}</div>
      <h2 class="hx fit rv2" style="--d:150ms">Thank you, ${esc(name)}.</h2>
      <p class="hx2 sub2 rv2" style="--d:250ms">Your deal team will be in touch within 48 hours.</p>
      <p class="p rv2" style="--d:350ms">We've shared your plan with ${list.length === 1 ? list[0].n : `${list.length} contacts`} and will send a copy to <b>${esc(email)}</b>.</p>
      <ol class="next">
        <li class="now rv2" style="--d:500ms"><span class="dot">${I.check}</span><span class="eyebrow">Today</span><b>Your plan is reviewed</b><span class="s">A relationship lead reads your goals and confirms the right introductions.</span></li>
        <li class="rv2" style="--d:600ms"><span class="dot">2</span><span class="eyebrow">Within 48 hours</span><b>Introductions arranged</b><span class="s">${esc(S.how)}. We'll propose times that work for you.</span></li>
        <li class="rv2" style="--d:700ms"><span class="dot">3</span><span class="eyebrow">Next 90 days</span><b>Your plan in motion</b><span class="s">Site visits, partner meetings and a 48-Hour Business Trip if it's right for you.</span></li>
      </ol>
      <div class="ref rv2" style="--d:800ms"><span>Reference <b>${ref}</b></span><span class="sample">Prototype</span><span>Nothing was sent or stored</span></div>
      <div class="acts rv2" style="--d:880ms">
        <button class="btn" id="new" type="button">Start a new plan ${I.arrow}</button>
        <button class="lnk" id="back" type="button">Back to my plan</button>
      </div>
    </div>`;
  $(".panel", s).scrollTop = 0;
  fit(s);
  $("#back", s).addEventListener("click", () => closeSheet());
  $("#new", s).addEventListener("click", () => { closeSheet(); attract(); });
}

/* =========================================================
   6. LIVED IT FILM — poster probe + full-screen player
   ========================================================= */
function probeFilm(k, root){
  const p = $("#poster", root), v = p && $("video", p), d = $("#fdur", root);
  if (!v) return;
  v.addEventListener("loadeddata", () => p.classList.add("ready"), {once:true});
  v.addEventListener("loadedmetadata", () => { if (isFinite(v.duration) && v.duration > 0) d.textContent = mmss(v.duration); }, {once:true});
  v.addEventListener("error", () => { p.classList.add("missing"); d.textContent = "In production"; }, {once:true});
  v.src = filmSrc(k) + "#t=4";   // poster frame: first light (S02)
}
let player;
function ensurePlayer(){
  if (player) return player;
  player = document.createElement("div");
  player.className = "player";
  player.setAttribute("role", "dialog");
  player.setAttribute("aria-modal", "true");
  player.setAttribute("aria-label", "LIVED IT film");
  player.innerHTML = `
    <div class="pbar"><div class="t"><b>Lived it · <i id="pt"></i></b><span>${BRAND.series} · sample film</span></div><button class="px" type="button" aria-label="Close film">${I.close}</button></div>
    <div class="pstage">
      <video id="pv" playsinline controls preload="metadata"></video>
      <div class="inprod" hidden>
        <div class="w hx fit">Lived it</div><div class="s" id="ips"></div>
        <span class="state">Film in production</span>
        <p>A short film from a leader who made this move, in their own words. It will play here as soon as it's ready.</p>
        <button class="lnk" type="button" id="ipcta">Talk to someone who lived it</button>
        <small id="ipf"></small>
      </div>
    </div>
    <div class="pfoot"><span class="ailabel g">AI generated · interview stand-ins &amp; scenes</span><span class="ailabel">Sample interviews · talent TBC</span><span class="pnote">Plays muted with subtitles · tap the speaker for sound</span></div>`;
  document.body.appendChild(player);
  $(".px", player).addEventListener("click", closeFilm);
  $("#ipcta", player).addEventListener("click", () => { closeFilm(); handoff(); });
  return player;
}
function openFilm(k){
  const p = ensurePlayer(), v = $("#pv", p), ip = $(".inprod", p), f = FILMS[k] || FILMS.hq;
  $("#pt", p).textContent = f.t; $("#ips", p).textContent = f.t;
  ip.hidden = true; p.classList.remove("missing");
  const vert = window.matchMedia("(max-width:767px) and (orientation:portrait)").matches;
  const srcs = vert ? [filmSrc(k, true), filmSrc(k)] : [filmSrc(k)];
  $("#ipf", p).textContent = `Expected file: ${srcs[srcs.length-1].replace(FILM_DIR, "films/")}`;
  let i = 0;
  const next = () => {
    if (i >= srcs.length){ v.onerror = null; p.classList.add("missing"); ip.hidden = false; fit(p); return; }
    v.src = srcs[i++]; v.muted = true;
    const pr = v.play(); if (pr) pr.catch(() => {});
  };
  v.onerror = next;
  next();
  p.classList.add("on"); document.body.classList.add("noscroll");
  fit(p);
  later(() => $(".px", p).focus(), 60);
}
function closeFilm(){
  if (!player || !player.classList.contains("on")) return;
  const v = $("#pv", player);
  v.onerror = null; v.pause(); v.removeAttribute("src"); v.load();
  player.classList.remove("on"); document.body.classList.remove("noscroll");
}

/* =========================================================
   KIOSK: Esc resets; idle 4 min returns to start
   ========================================================= */
document.addEventListener("keydown", e => { if (e.key === "Escape"){ if (player && player.classList.contains("on")) closeFilm(); else if (sheet && sheet.classList.contains("on")) closeSheet(); else attract(); } });
let idle;
const bump = () => { clearTimeout(idle); idle = setTimeout(() => { if (!$(".screen.attract.on")) attract(); }, 240000); };
["pointerdown","keydown","scroll","touchstart"].forEach(ev => document.addEventListener(ev, bump, {passive:true, capture:true}));
bump();

/* deep link for demos / screenshots: #intake | #think | #plan=hq|life|talent|latam | #handoff | #done | #film */
const hash = location.hash.slice(1);
const mm = hash.match(/^(intake|think|plan|handoff|done|film)(?:=(\w+))?/);
if (mm){
  S.scn = SC[mm[2]] ? mm[2] : "hq";
  S.goal = {hq:"Relocate our headquarters", life:"Find life-sciences lab space", talent:"Hire engineering talent", latam:"Set up an Americas / LatAm hub"}[S.scn];
  S.market = {hq:"New York", life:"Boston", talent:"the Bay Area", latam:"Chicago"}[S.scn];
  S.size = {hq:"50–250", life:"Under 50", talent:"250–1,000", latam:"50–250"}[S.scn];
  if (mm[1] === "intake") intake();
  else if (mm[1] === "think") thinking();
  else if (mm[1] === "film"){ plan(); setTimeout(() => openFilm(S.scn), 300); }
  else { plan(); if (mm[1] === "handoff" || mm[1] === "done") setTimeout(() => { handoff(); if (mm[1] === "done") confirmed({name:"Alex", email:"alex@company.com", list: SC[S.scn].people}); }, 300); }
} else attract();
})();
